<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F9FAFB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#F3F4F6"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="70" fill="url(#headerGrad)"/>
  <text x="450" y="42" text-anchor="middle" fill="white" font-size="24" font-weight="bold">Motorpool System Overview</text>

  <!-- User Roles Section -->
  <text x="450" y="105" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">USER ROLES</text>
  
  <!-- Admin -->
  <g filter="url(#shadow)">
    <rect x="80" y="120" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <circle cx="115" cy="145" r="12" fill="#DC2626"/>
    <text x="115" y="150" text-anchor="middle" fill="white" font-size="11" font-weight="bold">A</text>
    <text x="150" y="145" fill="#111827" font-size="13" font-weight="600">Admin</text>
    <text x="150" y="165" fill="#6B7280" font-size="10">Full system access</text>
    <text x="150" y="178" fill="#6B7280" font-size="10">Manage all modules</text>
  </g>

  <!-- Staff -->
  <g filter="url(#shadow)">
    <rect x="250" y="120" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <circle cx="285" cy="145" r="12" fill="#2563EB"/>
    <text x="285" y="150" text-anchor="middle" fill="white" font-size="11" font-weight="bold">S</text>
    <text x="320" y="145" fill="#111827" font-size="13" font-weight="600">Staff</text>
    <text x="320" y="165" fill="#6B7280" font-size="10">Submit for approval</text>
    <text x="320" y="178" fill="#6B7280" font-size="10">View all records</text>
  </g>

  <!-- Driver/User -->
  <g filter="url(#shadow)">
    <rect x="420" y="120" width="140" height="70" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <circle cx="455" cy="145" r="12" fill="#059669"/>
    <text x="455" y="150" text-anchor="middle" fill="white" font-size="11" font-weight="bold">D</text>
    <text x="490" y="145" fill="#111827" font-size="13" font-weight="600">Driver</text>
    <text x="490" y="165" fill="#6B7280" font-size="10">View assigned vehicles</text>
    <text x="490" y="178" fill="#6B7280" font-size="10">Request trip tickets</text>
  </g>

  <!-- Central Hub -->
  <g filter="url(#shadow)">
    <rect x="630" y="110" width="200" height="90" rx="12" fill="#4F46E5"/>
    <text x="730" y="145" text-anchor="middle" fill="white" font-size="16" font-weight="bold">MOTORPOOL</text>
    <text x="730" y="168" text-anchor="middle" fill="#C7D2FE" font-size="12">SYSTEM</text>
    <text x="730" y="188" text-anchor="middle" fill="#C7D2FE" font-size="10">Laravel + Livewire</text>
  </g>

  <!-- Arrows from roles to system -->
  <path d="M220 155 L620 155" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 155 L620 155" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <path d="M560 155 L620 155" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>

  <!-- Core Modules Section -->
  <text x="450" y="235" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">CORE MODULES</text>

  <!-- Vehicle Management -->
  <g filter="url(#shadow)">
    <rect x="40" y="255" width="155" height="100" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="40" y="255" width="155" height="35" rx="10" fill="#3B82F6"/>
    <rect x="40" y="275" width="155" height="15" fill="#3B82F6"/>
    <text x="117" y="278" text-anchor="middle" fill="white" font-size="12" font-weight="600">🚗 Vehicles</text>
    <text x="50" y="310" fill="#374151" font-size="10">• CRUD operations</text>
    <text x="50" y="325" fill="#374151" font-size="10">• Status tracking</text>
    <text x="50" y="340" fill="#374151" font-size="10">• Photo upload</text>
  </g>

  <!-- Maintenance -->
  <g filter="url(#shadow)">
    <rect x="215" y="255" width="155" height="100" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="215" y="255" width="155" height="35" rx="10" fill="#10B981"/>
    <rect x="215" y="275" width="155" height="15" fill="#10B981"/>
    <text x="292" y="278" text-anchor="middle" fill="white" font-size="12" font-weight="600">🔧 Maintenance</text>
    <text x="225" y="310" fill="#374151" font-size="10">• 22-point checklist</text>
    <text x="225" y="325" fill="#374151" font-size="10">• Materials tracking</text>
    <text x="225" y="340" fill="#374151" font-size="10">• Cost calculation</text>
  </g>

  <!-- Repair -->
  <g filter="url(#shadow)">
    <rect x="390" y="255" width="155" height="100" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="390" y="255" width="155" height="35" rx="10" fill="#F59E0B"/>
    <rect x="390" y="275" width="155" height="15" fill="#F59E0B"/>
    <text x="467" y="278" text-anchor="middle" fill="white" font-size="12" font-weight="600">🛠️ Repairs</text>
    <text x="400" y="310" fill="#374151" font-size="10">• Unscheduled fixes</text>
    <text x="400" y="325" fill="#374151" font-size="10">• Parts & labor</text>
    <text x="400" y="340" fill="#374151" font-size="10">• Cost breakdown</text>
  </g>

  <!-- Trip Tickets -->
  <g filter="url(#shadow)">
    <rect x="565" y="255" width="155" height="100" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="565" y="255" width="155" height="35" rx="10" fill="#8B5CF6"/>
    <rect x="565" y="275" width="155" height="15" fill="#8B5CF6"/>
    <text x="642" y="278" text-anchor="middle" fill="white" font-size="12" font-weight="600">🎫 Trip Tickets</text>
    <text x="575" y="310" fill="#374151" font-size="10">• Trip requests</text>
    <text x="575" y="325" fill="#374151" font-size="10">• Driver assignment</text>
    <text x="575" y="340" fill="#374151" font-size="10">• Odometer tracking</text>
  </g>

  <!-- Calendar -->
  <g filter="url(#shadow)">
    <rect x="740" y="255" width="120" height="100" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="740" y="255" width="120" height="35" rx="10" fill="#EC4899"/>
    <rect x="740" y="275" width="120" height="15" fill="#EC4899"/>
    <text x="800" y="278" text-anchor="middle" fill="white" font-size="12" font-weight="600">📅 Calendar</text>
    <text x="750" y="310" fill="#374151" font-size="10">• Schedule view</text>
    <text x="750" y="325" fill="#374151" font-size="10">• Event tracking</text>
    <text x="750" y="340" fill="#374151" font-size="10">• List/Grid view</text>
  </g>

  <!-- System Features Section -->
  <text x="450" y="395" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">SYSTEM FEATURES</text>

  <!-- Approval Workflow -->
  <g filter="url(#shadow)">
    <rect x="60" y="415" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="60" y="415" width="180" height="30" rx="10" fill="#6366F1"/>
    <rect x="60" y="430" width="180" height="15" fill="#6366F1"/>
    <text x="150" y="437" text-anchor="middle" fill="white" font-size="11" font-weight="600">✅ Approval Workflow</text>
    <text x="75" y="465" fill="#374151" font-size="10">Staff → Submit → Admin Review</text>
    <text x="75" y="480" fill="#374151" font-size="10">Approve / Reject with notes</text>
    <text x="75" y="495" fill="#374151" font-size="10">Track submission status</text>
  </g>

  <!-- Notifications -->
  <g filter="url(#shadow)">
    <rect x="260" y="415" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="260" y="415" width="180" height="30" rx="10" fill="#0EA5E9"/>
    <rect x="260" y="430" width="180" height="15" fill="#0EA5E9"/>
    <text x="350" y="437" text-anchor="middle" fill="white" font-size="11" font-weight="600">🔔 Notifications</text>
    <text x="275" y="465" fill="#374151" font-size="10">Email alerts for maintenance</text>
    <text x="275" y="480" fill="#374151" font-size="10">Retry failed notifications</text>
    <text x="275" y="495" fill="#374151" font-size="10">Notification history logs</text>
  </g>

  <!-- User Management -->
  <g filter="url(#shadow)">
    <rect x="460" y="415" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="460" y="415" width="180" height="30" rx="10" fill="#14B8A6"/>
    <rect x="460" y="430" width="180" height="15" fill="#14B8A6"/>
    <text x="550" y="437" text-anchor="middle" fill="white" font-size="11" font-weight="600">👥 User Management</text>
    <text x="475" y="465" fill="#374151" font-size="10">Role-based access control</text>
    <text x="475" y="480" fill="#374151" font-size="10">Account approval workflow</text>
    <text x="475" y="495" fill="#374151" font-size="10">Password reset by admin</text>
  </g>

  <!-- Export & Reports -->
  <g filter="url(#shadow)">
    <rect x="660" y="415" width="180" height="85" rx="10" fill="url(#cardGrad)" stroke="#E5E7EB"/>
    <rect x="660" y="415" width="180" height="30" rx="10" fill="#F97316"/>
    <rect x="660" y="430" width="180" height="15" fill="#F97316"/>
    <text x="750" y="437" text-anchor="middle" fill="white" font-size="11" font-weight="600">📊 Export & Reports</text>
    <text x="675" y="465" fill="#374151" font-size="10">CSV export</text>
    <text x="675" y="480" fill="#374151" font-size="10">Excel export</text>
    <text x="675" y="495" fill="#374151" font-size="10">Activity audit logs</text>
  </g>

  <!-- Data Flow Section -->
  <text x="450" y="540" text-anchor="middle" fill="#374151" font-size="14" font-weight="600">DATA FLOW</text>

  <!-- Data flow diagram -->
  <g filter="url(#shadowLight)">
    <rect x="100" y="555" width="700" height="70" rx="35" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
    
    <!-- User Input -->
    <circle cx="170" cy="590" r="25" fill="#4F46E5"/>
    <text x="170" y="595" text-anchor="middle" fill="white" font-size="18">👤</text>
    <text x="170" y="625" text-anchor="middle" fill="#4F46E5" font-size="9" font-weight="600">User Input</text>
    
    <!-- Arrow -->
    <path d="M200 590 L260 590" stroke="#4F46E5" stroke-width="2" fill="none"/>
    <polygon points="260,590 252,585 252,595" fill="#4F46E5"/>
    
    <!-- Validation -->
    <circle cx="300" cy="590" r="25" fill="#10B981"/>
    <text x="300" y="595" text-anchor="middle" fill="white" font-size="18">✓</text>
    <text x="300" y="625" text-anchor="middle" fill="#10B981" font-size="9" font-weight="600">Validation</text>
    
    <!-- Arrow -->
    <path d="M330 590 L390 590" stroke="#10B981" stroke-width="2" fill="none"/>
    <polygon points="390,590 382,585 382,595" fill="#10B981"/>
    
    <!-- Approval -->
    <circle cx="430" cy="590" r="25" fill="#F59E0B"/>
    <text x="430" y="595" text-anchor="middle" fill="white" font-size="18">⏳</text>
    <text x="430" y="625" text-anchor="middle" fill="#F59E0B" font-size="9" font-weight="600">Approval</text>
    
    <!-- Arrow -->
    <path d="M460 590 L520 590" stroke="#F59E0B" stroke-width="2" fill="none"/>
    <polygon points="520,590 512,585 512,595" fill="#F59E0B"/>
    
    <!-- Database -->
    <circle cx="560" cy="590" r="25" fill="#3B82F6"/>
    <text x="560" y="595" text-anchor="middle" fill="white" font-size="18">💾</text>
    <text x="560" y="625" text-anchor="middle" fill="#3B82F6" font-size="9" font-weight="600">Database</text>
    
    <!-- Arrow -->
    <path d="M590 590 L650 590" stroke="#3B82F6" stroke-width="2" fill="none"/>
    <polygon points="650,590 642,585 642,595" fill="#3B82F6"/>
    
    <!-- Notification -->
    <circle cx="690" cy="590" r="25" fill="#8B5CF6"/>
    <text x="690" y="595" text-anchor="middle" fill="white" font-size="18">📧</text>
    <text x="690" y="625" text-anchor="middle" fill="#8B5CF6" font-size="9" font-weight="600">Notify</text>
    
    <!-- Arrow -->
    <path d="M720 590 L780 590" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <polygon points="780,590 772,585 772,595" fill="#8B5CF6"/>
    
    <!-- Complete -->
    <circle cx="730" cy="590" r="25" fill="#8B5CF6" fill-opacity="0"/>
  </g>

</svg>
